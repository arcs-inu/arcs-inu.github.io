<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=5.0" name="viewport"/>
<meta content="no-referrer" name="referrer"/>
<title>ARCS Lab | Advanced Radio-Frequency Integrated Circuit and System Design Lab.</title>
<link href="images/common_logo.png" rel="icon" type="image/png"/>
<link as="style" crossorigin="" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/variable/pretendardvariable.css" rel="stylesheet"/>
<!-- 공통 CSS (페이지별 CSS는 js/app.js 가 페이지 방문 시 자동 로드) -->
<link href="css/base.css" rel="stylesheet"/>
</head>
<body>

<!-- 공통 헤더 -->
<header>
<div class="nav-inner">
<a aria-label="ARCS Lab home" class="logo-wrap" href="#home" onclick="showView('home'); return false;">
<img alt="ARCS Lab" class="logo-img" src="images/common_logo.png"/>
</a>
<button aria-expanded="false" aria-label="메뉴 열기" class="mobile-menu-toggle" id="mobile-menu-toggle" type="button">☰</button>
<nav class="nav-menu">
<a class="nav-btn active" href="#home" id="btn-home" onclick="showView('home'); return false;">Home</a>
<div class="nav-item">
<button class="nav-btn" id="btn-family">Family ▾</button>
<div class="dropdown">
<button onclick="showView('pi')">PI</button>
<button onclick="showView('student')">Student</button>
</div>
</div>
<div class="nav-item">
<button class="nav-btn" id="btn-research">Research ▾</button>
<div class="dropdown">
<button onclick="showView('research')">Research</button>
<button onclick="showView('chips')">Chip Gallery</button>
</div>
</div>
<div class="nav-item">
<button class="nav-btn" id="btn-achievement">Achievement ▾</button>
<div class="dropdown">
<button onclick="showView('publications')">Publications</button>
<button onclick="showView('patents')">Patents</button>
</div>
</div>
<button class="nav-btn" id="btn-project" onclick="showView('project')">Project</button>
<button class="nav-btn" id="btn-talks" onclick="showView('invited-talks')">Invited Talks</button>
<button class="nav-btn" id="btn-teaching" onclick="showView('teaching')">Teaching</button>
<button class="nav-btn" id="btn-news" onclick="showView('news')">News</button>
<button class="nav-btn" id="btn-gallery" onclick="showView('lab-gallery')">Lab. Gallery</button>
</nav>
</div>
</header>

<!-- 페이지가 삽입되는 영역 (pages/*.html) -->
<main id="app"></main>

<!-- 공통 푸터 -->
<footer>
<div style="max-width:1140px; margin:0 auto; padding:0 20px;">
<p style="font-weight:800; color:var(--primary); margin-bottom:4px;">ARCS Lab | Incheon National University</p>
<p>© 2026 ARCS Lab. All rights reserved. | Contact: ghaenglee@inu.ac.kr</p>
</div>
</footer>

<!-- 앨범 라이트박스 -->
<div class="gallery-lightbox" id="galleryLightbox" onclick="closeGalleryAlbum(event)">
<span class="gallery-lightbox-close" onclick="closeGalleryAlbum(event)">✕</span>
<button class="gallery-lightbox-prev" type="button" aria-label="Previous photo" onclick="changeGalleryAlbum(-1, event)">‹</button>
<img alt="Lab Gallery enlarged photo" class="gallery-lightbox-content" id="galleryLightboxTarget" src="" onclick="event.stopPropagation();"/>
<button class="gallery-lightbox-next" type="button" aria-label="Next photo" onclick="changeGalleryAlbum(1, event)">›</button>
<div class="gallery-lightbox-hint">Drag to move · ← → to browse · ESC to close</div>
</div>

<!-- 단일 이미지 확대 모달 -->
<div class="img-modal-overlay" id="imgModalOverlay" onclick="closeImageModal()">
<span class="img-modal-close" onclick="closeImageModal()">✕</span>
<img alt="확대 이미지" class="img-modal-content" id="imgModalTarget" onclick="event.stopPropagation();" src=""/>
</div>

<script src="js/lightbox.js"></script>
<script src="js/app.js"></script>
</body>
</html>
